
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Birthday Assistant - V5</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="page">

        <header class="academic-header">
            <div>
                <h1>Birthday Assistant <span>V5</span></h1>
                <p class="subtitle">
                    Your personal birthday assistant. Type or speak your questions.
                </p>
            </div>
        </header>

        <section class="chat-card">

            <div id="chat" class="chat" aria-live="polite"></div>

            <div class="chips">
                <button class="chip" data-q="What are the upcoming birthdays?">
                    Upcoming birthdays
                </button>

                <button class="chip" data-q="How many birthdays are there next month?">
                    Count next month
                </button>

                <button class="chip" data-q="Is there any birthday tomorrow?">
                    Tomorrow
                </button>

                <button class="chip" data-q="When is my wife's birthday?">
                    Wife's birthday
                </button>

                <button class="chip" data-q="Any nephew birthdays in September?">
                    Nephews in September
                </button>
            </div>

            <form id="chat-form" class="composer">
                <input
                    id="question"
                    autocomplete="off"
                    placeholder="Type your question here..."
                    aria-label="Question"
                >

                <button type="submit" class="send">Send</button>

                <button type="button" class="chip" id="speak-button">
                    🎤 Speak
                </button>
            </form>

            <div class="hint">
                You can type or speak your questions.
            </div>

            <label class="hint">
                <input type="checkbox" id="speak-back" checked>
                Read responses aloud
            </label>

        </section>

    </main>

    <script src="{{ url_for('static', filename='chat.js') }}"></script>

</body>
</html>
